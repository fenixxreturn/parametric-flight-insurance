[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[lint]
# Timestamps gate hour-scale windows (sale cutoff, report window); validator skew of seconds is harmless.
exclude_lints = ["block-timestamp"]
# Test code uses bounded fuzz casts and raw transfers on a known mock on purpose.
ignore = ["test/**/*.sol"]
